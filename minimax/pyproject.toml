[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minimax-sdd-context"
version = "0.1.0"
description = "规有所依：面向软件持续演进的 SDD 上下文管理系统（seekdb + PowerContext + MiniMax）"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pyseekdb==1.4.0.post1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sddctx = "sdd_context.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sdd_context"]
