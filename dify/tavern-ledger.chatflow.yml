app:
  name: 鲸落酒馆 · 老账房
  description: 一个会跨会话记住你每件荒唐事的酒馆 NPC。由 Dify Chatflow 编排，PowerContext 记账与翻旧账。
  icon: 🏮
  icon_background: '#FFEAD5'
  mode: advanced-chat
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables:
  - name: POWERCONTEXT_BASE_URL
    description: PowerContext Server 地址，例如 http://127.0.0.1:8000
    value: http://127.0.0.1:8000
    value_type: string
    selector:
    - env
    - POWERCONTEXT_BASE_URL
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 500
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 100
        video_file_size_limit: 500
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: |-
      🏮 欢迎来到「鲸落酒馆」。我是账房先生老周，怀里这本《鲸落账本》，记着每位旅人干过的荒唐事。
      先报个名号（本次对话里一直用这个名字），然后每说一句话，就是你干的一件事——赊账、吹牛、往汤里加料都行。
      下次再进来，只要还叫这个名号，我可都记得。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我把盐当成糖，倒进了麦酒桶
    - 我赊了三杯麦酒，还把账本上的名字改成了隔壁老王
    - 我今天是来道歉的，上次的麦酒钱我补上
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: '1001'
      type: custom
      position:
        x: 80
        y: 300
      positionAbsolute:
        x: 80
        y: 300
      width: 244
      height: 130
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 开始
        desc: 收集旅人名号；每轮聊天内容就是本轮动作
        type: start
        selected: false
        variables:
        - variable: player_name
          label: 你的名号
          description: 账本按名号记账。下次用同名再进店，老周就能翻出旧账。
          type: text-input
          required: true
          max_length: 24
          options: []
    - id: '1002'
      type: custom
      position:
        x: 380
        y: 300
      positionAbsolute:
        x: 380
        y: 300
      width: 244
      height: 160
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        title: 整理输入
        desc: ''
        type: code
        selected: false
        code_language: python3
        code: |
          # ruff: noqa: RUF001
          import json

          MAX_PLAYER_CHARS = 24
          MAX_ACTION_CHARS = 400
          MAX_DEED_CHARS = 600


          def main(arg_name: str, arg_action: str) -> dict:
              player = " ".join((arg_name or "").split())[:MAX_PLAYER_CHARS].strip() or "无名旅人"
              action = " ".join((arg_action or "").split())[:MAX_ACTION_CHARS].strip() or "我站在门口发呆"
              scope_body = json.dumps(
                  {
                      "title": "鲸落酒馆账本 · " + player,
                      "summary": "酒馆账房先生保存的玩家恶作剧、赊账与赖账记录",
                      "idempotency_key": "tavern-ledger-v1:" + player,
                  },
                  ensure_ascii=False,
              )
              deed_text = ("玩家" + player + "：" + action)[:MAX_DEED_CHARS]
              return {
                  "player": player,
                  "action": action,
                  "scope_body": scope_body,
                  "deed_text": deed_text,
              }
        variables:
        - variable: arg_name
          value_selector:
          - '1001'
          - player_name
        - variable: arg_action
          value_selector:
          - sys
          - query
        outputs:
          player:
            type: string
            children: null
          action:
            type: string
            children: null
          scope_body:
            type: string
            children: null
          deed_text:
